<div class="auth-page">
  <div class="auth-card">
    <h1>{{ i18n.t()('auth.register') }}</h1>
    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>{{ i18n.t()('auth.username') }}</label>
        <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>{{ i18n.t()('auth.email') }}</label>
        <input type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>{{ i18n.t()('auth.password') }}</label>
        <input type="password" [(ngModel)]="password" name="password" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>{{ i18n.t()('auth.confirmPassword') }}</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading() || !username || !email || !password || !confirmPassword">
        {{ loading() ? i18n.t()('common.loading') : i18n.t()('auth.submit.register') }}
      </button>
    </form>
    <p class="auth-link">
      <a routerLink="/login">{{ i18n.t()('auth.switchToLogin') }}</a>
    </p>
  </div>
</div>
