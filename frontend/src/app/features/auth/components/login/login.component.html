<div class="auth-page">
  <div class="auth-card">
    <h1>{{ i18n.t()('auth.login') }}</h1>
    @if (error()) {
      <div class="auth-error">{{ error() }}</div>
    }
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>{{ i18n.t()('auth.username') }}</label>
        <input type="text" [(ngModel)]="username" name="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>{{ i18n.t()('auth.password') }}</label>
        <input type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" [disabled]="loading() || !username || !password">
        {{ loading() ? i18n.t()('common.loading') : i18n.t()('auth.submit.login') }}
      </button>
    </form>
    <p class="auth-link">
      <a routerLink="/register">{{ i18n.t()('auth.switchToRegister') }}</a>
    </p>
  </div>
</div>
