server:
  port: 8088

spring:
  datasource:
    url: jdbc:h2:mem:kanban_board
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:a2FuYmFuYm9hcmRzZWNyZXRrZXlmb3Jqd3R0b2tlbmdlbmVyYXRpb24xMjM0NTY3ODkw}
    expiration: 86400000
  seed:
    demo:
      username: ${SEED_DEMO_USERNAME:demo}
      password: ${SEED_DEMO_PASSWORD:demo123}
      email: ${SEED_DEMO_EMAIL:demo@kanban.com}
    alice:
      username: ${SEED_ALICE_USERNAME:alice}
      password: ${SEED_ALICE_PASSWORD:alice123}
      email: ${SEED_ALICE_EMAIL:alice@kanban.com}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
