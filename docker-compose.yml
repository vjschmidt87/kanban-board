services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban-board-db
    environment:
      POSTGRES_DB: kanban_board
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5440:5432"
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d kanban_board"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kanban-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kanban-board-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kanban_board
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-a2FuYmFuYm9hcmRzZWNyZXRrZXlmb3Jqd3R0b2tlbmdlbmVyYXRpb24xMjM0NTY3ODkw}
      SEED_DEMO_USERNAME: ${SEED_DEMO_USERNAME:-demo}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo123}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@kanban.com}
      SEED_ALICE_USERNAME: ${SEED_ALICE_USERNAME:-alice}
      SEED_ALICE_PASSWORD: ${SEED_ALICE_PASSWORD:-alice123}
      SEED_ALICE_EMAIL: ${SEED_ALICE_EMAIL:-alice@kanban.com}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8088/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kanban-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kanban-board-frontend
    ports:
      - "4208:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kanban-net

volumes:
  kanban_pgdata:
    name: kanban_pgdata

networks:
  kanban-net:
    driver: bridge
